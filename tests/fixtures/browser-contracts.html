<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser contracts</title>
<style>body{font:18px system-ui;background:#edf3fa;color:#17304d;padding:28px}h1{margin-top:0}main{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}button,a,input{font:inherit}button,a{display:block;padding:22px;background:white;border:1px solid #8294ad;border-radius:12px;color:#17304d;text-align:center;text-decoration:none}pre{white-space:pre-wrap}label{padding:22px;background:white;border-radius:12px}</style>
<h1>Browser contracts</h1><main>
<button id="confirm">Confirm</button><button id="prompt">Text prompt</button><button id="alert">Alert</button>
<label>Choose file <input id="file" type="file"></label><button id="blob">Blob download</button>
<form action="/download" method="post"><input type="hidden" name="token" value="body-only"><button>POST download</button></form>
<a href="/auth">Authentication</a><button id="popup">Open popup</button><a href="/next.html">Navigate away</a>
<button id="blank-popup">Blank popup</button><button id="no-opener">No opener</button>
</main><pre id="result">Ready</pre>
<script>
const report=(kind,value)=>{document.querySelector('#result').textContent=JSON.stringify({kind,value});fetch('/receipt',{method:'POST',body:JSON.stringify({kind,value})});};
document.querySelector('#confirm').onclick=()=>report('confirm',confirm('Return a result to the page'));
document.querySelector('#prompt').onclick=()=>report('prompt',prompt('Return text to the page','fixture-text'));
document.querySelector('#alert').onclick=()=>{alert('Dismiss to continue');report('alert','continued');};
document.querySelector('#file').onchange=event=>report('file',Array.from(event.target.files,f=>({name:f.name,size:f.size})));
document.querySelector('#blob').onclick=()=>{const url=URL.createObjectURL(new Blob(['yeoyu-blob-response\n'],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=url;a.download='yeoyu-blob-contract.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);};
document.querySelector('#popup').onclick=()=>{const child=window.open('/popup','contract-popup');report('popup-created',!!child);};
document.querySelector('#blank-popup').onclick=()=>{const child=window.open('about:blank');report('blank-popup-created',!!child);if(child){child.document.write('<title>Blank popup</title><h1>Written by opener</h1><button onclick="window.close()">Close popup</button>');child.document.close();}};
document.querySelector('#no-opener').onclick=()=>report('noopener-return',window.open('/popup','_blank','noopener')===null);
window.addEventListener('message',event=>{if(event.origin===location.origin){report('popup-message',event.data);event.source.postMessage('parent-ack',event.origin);}});
report('loaded',location.pathname);
</script></html>
