name: Android verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_ABIS: aarch64-linux-android
      BROWSER_ARCHS: arm64-v8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned toolchain and Android packages
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0' 'ndk;27.1.12297006'
      - name: Bootstrap pinned dependencies
        run: sh scripts/bootstrap.sh
      - name: Android policy and storage tests
        run: android/gradlew -p android :app:testDebugUnitTest --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Build explicitly local test APK
        run: sh scripts/build-android.sh LocalRelease
      - name: Record test artifact checksum
        run: sha256sum dist/yeoyu-local-release.apk > dist/yeoyu-local-release.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-verification
          retention-days: 7
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
            dist/yeoyu-local-release.apk
            dist/yeoyu-local-release.sha256
